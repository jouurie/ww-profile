name: Clean old Pages deployment records
on:
  workflow_dispatch:
permissions:
  deployments: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve latest Pages deployment and remove inactive older records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: jouurie/ww-profile
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jouurie/ww-profile"
          gh api --paginate --slurp 'repos/jouurie/ww-profile/deployments?environment=github-pages&per_page=100' > deployments.json
          jq '[.[][]] | sort_by(.id) | reverse' deployments.json > ordered.json
          keep=$(jq -r '.[0].id // empty' ordered.json)
          test -n "$keep"
          latest_state=$(gh api "repos/jouurie/ww-profile/deployments/$keep/statuses?per_page=1" --jq '.[0].state // "unknown"')
          test "$latest_state" = success
          echo "Preserving latest deployment: $keep"
          jq -r '.[] | [.id, .sha, .environment] | @tsv' ordered.json
          while IFS= read -r id; do
            test "$id" != "$keep"
            state=$(gh api "repos/jouurie/ww-profile/deployments/$id/statuses?per_page=1" --jq '.[0].state // "unknown"')
            if test "$state" = queued || test "$state" = pending || test "$state" = in_progress; then
              echo "Preserved unfinished deployment $id with state $state"
              continue
            fi
            if test "$state" != inactive; then
              gh api --method POST "repos/jouurie/ww-profile/deployments/$id/statuses" -f state=inactive -f description="Old deployment record cleanup; newest deployment preserved" >/dev/null
            fi
            gh api --method DELETE "repos/jouurie/ww-profile/deployments/$id"
            echo "Deleted older deployment: $id"
          done < <(jq -r '.[1:][].id' ordered.json)
          gh api 'repos/jouurie/ww-profile/deployments?environment=github-pages&per_page=100' --jq 'length'
