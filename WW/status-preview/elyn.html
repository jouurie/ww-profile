<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: https://cdn.imgchest.com; font-src 'self' https://cdn.jsdelivr.net; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>ELYN 상태창 미리보기</title><style>html,body{margin:0;padding:0;background:transparent}#root{padding-top:24px}#preview-tools{box-sizing:border-box;padding:12px;font:13px/1.5 sans-serif;color:#f1ddbd;background:#181817}#preview-tools p{margin:0 0 8px}#command-result[hidden]{display:none}#command-result{display:flex;gap:8px;align-items:center}#command-value{box-sizing:border-box;min-width:0;width:100%;padding:6px}#copy-command{flex-shrink:0;padding:6px}#command-note{display:block;margin-top:6px}</style></head><body><main id="root"></main><aside id="preview-tools"><p>엘린 상태창 미리보기입니다. 눌러서 펼칠 수 있습니다.</p><div id="command-result" hidden><input id="command-value" readonly aria-label="선택한 명령어"><button id="copy-command" type="button">복사</button></div><span id="command-note" role="status">명령어는 이 미리보기 안에서만 표시됩니다.</span></aside><script src="./elyn.bundle.js"></script></body></html>
